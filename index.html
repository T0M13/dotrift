<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dotrift — live demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 3rem 1.5rem;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    h1 {
      font-family: 'Teko', sans-serif;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
      color: #fff;
      text-transform: uppercase;
    }

    #canvas-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 40px;
      overflow: hidden;
    }

    .hint {
      font-size: 0.78rem;
      color: #555;
      letter-spacing: 0.04em;
    }

    /* ── Controls panel ── */
    .controls {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .ctrl-group-label {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #333;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid #181818;
    }

    .ctrl-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0.75rem;
    }

    .ctrl-row label {
      font-size: 0.72rem;
      color: #555;
      letter-spacing: 0.03em;
    }

    .ctrl-row .val {
      font-size: 0.68rem;
      color: #333;
      min-width: 2.2rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .ctrl-row-inner {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: #1e1e1e;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #444;
      transition: background 0.15s;
    }
    input[type=range]:hover::-webkit-slider-thumb { background: #888; }
    input[type=range]::-moz-range-thumb {
      width: 12px; height: 12px;
      border: none;
      border-radius: 50%;
      background: #444;
    }

    /* ── Idle mode pills ── */
    .idle-pills {
      display: flex;
      gap: 0.4rem;
    }

    .idle-pills button {
      flex: 1;
      padding: 0.35rem 0;
      background: none;
      border: 1px solid #1e1e1e;
      border-radius: 5px;
      color: #444;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .idle-pills button:hover { border-color: #333; color: #888; }
    .idle-pills button.active { border-color: #444; color: #ccc; background: #161616; }

    .idle-sliders {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }
    .idle-sliders.visible {
      max-height: 200px;
      opacity: 1;
    }

    /* ── Bottom actions ── */
    .actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 1rem;
      border: 1px solid #1e1e1e;
      border-radius: 6px;
      color: #444;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      user-select: none;
    }
    .upload-label:hover { border-color: #444; color: #aaa; }
    .upload-label svg { flex-shrink: 0; }
    #file-input { display: none; }

    a {
      color: #333;
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    a:hover { color: #888; }
  </style>
</head>
<body>
  <h1
    data-dotrift-text
    data-grid="140"
    data-repel-radius="22"
    data-repel-force="22"
    data-ring-strength="3"
    data-global-ripples
  >dotrift</h1>

  <div id="canvas-wrap">
    <canvas id="demo-canvas"></canvas>
  </div>

  <p
    class="hint"
    data-dotrift-text
    data-grid="160"
    data-repel-radius="14"
    data-repel-force="18"
    data-ring-strength="2"
    data-global-ripples
  >hover · swipe · click</p>

  <!-- Controls -->
  <div class="controls">

    <div class="ctrl-group">
      <div class="ctrl-group-label">dots</div>

      <div class="ctrl-row">
        <div class="ctrl-row-inner">
          <label>grid density</label>
          <input type="range" id="sl-grid" min="40" max="200" step="5" value="150">
        </div>
        <span class="val" id="val-grid">150</span>
      </div>

      <div class="ctrl-row">
        <div class="ctrl-row-inner">
          <label>dot size</label>
          <input type="range" id="sl-dotSize" min="0.4" max="2.5" step="0.1" value="1.0">
        </div>
        <span class="val" id="val-dotSize">1.0</span>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-group-label">repel</div>

      <div class="ctrl-row">
        <div class="ctrl-row-inner">
          <label>radius</label>
          <input type="range" id="sl-repelRadius" min="5" max="80" step="1" value="22">
        </div>
        <span class="val" id="val-repelRadius">22</span>
      </div>

      <div class="ctrl-row">
        <div class="ctrl-row-inner">
          <label>force</label>
          <input type="range" id="sl-repelForce" min="1" max="80" step="1" value="25">
        </div>
        <span class="val" id="val-repelForce">25</span>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-group-label">shockwave</div>

      <div class="ctrl-row">
        <div class="ctrl-row-inner">
          <label>strength</label>
          <input type="range" id="sl-ringStrength" min="0" max="15" step="0.5" value="3">
        </div>
        <span class="val" id="val-ringStrength">3</span>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-group-label">idle</div>

      <div class="idle-pills">
        <button data-mode="" class="active">off</button>
        <button data-mode="drift">drift</button>
        <button data-mode="breathe">breathe</button>
        <button data-mode="wave">wave</button>
      </div>

      <div class="idle-sliders" id="idle-sliders">
        <div class="ctrl-row">
          <div class="ctrl-row-inner">
            <label>strength</label>
            <input type="range" id="sl-idleStrength" min="0.1" max="4" step="0.1" value="1">
          </div>
          <span class="val" id="val-idleStrength">1.0</span>
        </div>
        <div class="ctrl-row">
          <div class="ctrl-row-inner">
            <label>speed</label>
            <input type="range" id="sl-idleSpeed" min="0.1" max="4" step="0.1" value="1">
          </div>
          <span class="val" id="val-idleSpeed">1.0</span>
        </div>
        <div class="ctrl-row">
          <div class="ctrl-row-inner">
            <label>delay</label>
            <input type="range" id="sl-idleDelay" min="0" max="5000" step="100" value="2000">
          </div>
          <span class="val" id="val-idleDelay">2.0s</span>
        </div>
      </div>
    </div>

  </div>

  <div class="actions">
    <label class="upload-label" for="file-input">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      try your own image
    </label>
    <a href="https://github.com/T0M13/dotrift">github.com/T0M13/dotrift</a>
  </div>
  <input type="file" id="file-input" accept="image/*" />

  <script type="module" src="./src/auto-init.js"></script>
  <script type="module">
    import { createDotrift } from './src/dotrift.js';

    const canvas = document.getElementById('demo-canvas');
    const SIZE   = 180;

    const CONFIG = {
      width: SIZE, height: SIZE,
      grid: 150, dotSize: 1.0,
      repelRadius: 22, repelForce: 25,
      ringStrength: 3,
      idleAnimation: false, idleStrength: 1, idleSpeed: 1, idleDelay: 2000,
      globalRipples: true,
      trail: true,
    };

    let instance = null;
    let lastSource = 'demo/portrait.webp';

    function load(source) {
      lastSource = source;
      if (instance) { instance.destroy(); instance = null; }
      instance = createDotrift(canvas, source, { ...CONFIG });
    }

    load('demo/portrait.webp');

    // ── Sliders ──
    function bindSlider(id, key, format) {
      const sl  = document.getElementById('sl-' + id);
      const val = document.getElementById('val-' + id);
      sl.addEventListener('input', () => {
        const v = parseFloat(sl.value);
        val.textContent = format ? format(v) : v;
        CONFIG[key] = v;
        instance.set({ [key]: v });
      });
    }

    bindSlider('grid',        'grid',        null);
    bindSlider('dotSize',     'dotSize',     v => v.toFixed(1));
    bindSlider('repelRadius', 'repelRadius', null);
    bindSlider('repelForce',  'repelForce',  null);
    bindSlider('ringStrength','ringStrength',v => v % 1 === 0 ? v : v.toFixed(1));
    bindSlider('idleStrength','idleStrength',v => v.toFixed(1));
    bindSlider('idleSpeed',   'idleSpeed',   v => v.toFixed(1));
    bindSlider('idleDelay',   'idleDelay',   v => (v / 1000).toFixed(1) + 's');

    // ── Idle pills ──
    const pills       = document.querySelectorAll('.idle-pills button');
    const idleSliders = document.getElementById('idle-sliders');

    pills.forEach(btn => {
      btn.addEventListener('click', () => {
        pills.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.dataset.mode || false;
        CONFIG.idleAnimation = mode;
        instance.set({ idleAnimation: mode });
        idleSliders.classList.toggle('visible', !!mode);
      });
    });

    // ── Image upload ──
    document.getElementById('file-input').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const crop = document.createElement('canvas');
          crop.width = SIZE; crop.height = SIZE;
          const cc = crop.getContext('2d');
          const scale = Math.max(SIZE / img.naturalWidth, SIZE / img.naturalHeight);
          const sw = SIZE / scale, sh = SIZE / scale;
          const sx = (img.naturalWidth  - sw) / 2;
          const sy = (img.naturalHeight - sh) / 2;
          cc.drawImage(img, sx, sy, sw, sh, 0, 0, SIZE, SIZE);
          load(crop);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
