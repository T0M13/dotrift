<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dotrift — live demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #888;
      text-transform: uppercase;
    }

    #canvas-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 40px;
      overflow: hidden;
    }

    .hint {
      font-size: 0.78rem;
      color: #555;
      letter-spacing: 0.04em;
    }

    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 1rem;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #555;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      user-select: none;
    }
    .upload-label:hover { border-color: #444; color: #aaa; }
    .upload-label svg { flex-shrink: 0; }
    #file-input { display: none; }

    a {
      color: #444;
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    a:hover { color: #888; }
  </style>
</head>
<body>
  <h1>dotrift</h1>

  <div id="canvas-wrap">
    <canvas id="demo-canvas"></canvas>
  </div>

  <p class="hint">hover · swipe · click — always alive</p>

  <label class="upload-label" for="file-input">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    try your own image
  </label>
  <input type="file" id="file-input" accept="image/*" />

  <a href="https://github.com/T0M13/dotrift">github.com/T0M13/dotrift</a>

  <script type="module">
    import { createDotrift } from './src/dotrift.js';

    const canvas = document.getElementById('demo-canvas');
    const wrap   = document.getElementById('canvas-wrap');
    const SIZE   = 180;

    const CONFIG = {
      width: SIZE, height: SIZE,
      grid: 150, dotSize: 1.0,
      repelRadius: 22, repelForce: 25,
      ringStrength: 3,
    };

    let instance = null;

    function load(source) {
      if (instance) { instance.destroy(); instance = null; }
      instance = createDotrift(canvas, source, CONFIG);
    }

    load('demo/portrait.webp');

    document.getElementById('file-input').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          // crop to square (object-fit: cover) before passing in
          const crop = document.createElement('canvas');
          crop.width = SIZE; crop.height = SIZE;
          const cc = crop.getContext('2d');
          const scale = Math.max(SIZE / img.naturalWidth, SIZE / img.naturalHeight);
          const sw = SIZE / scale, sh = SIZE / scale;
          const sx = (img.naturalWidth  - sw) / 2;
          const sy = (img.naturalHeight - sh) / 2;
          cc.drawImage(img, sx, sy, sw, sh, 0, 0, SIZE, SIZE);
          load(crop);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
